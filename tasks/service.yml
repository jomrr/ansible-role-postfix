---
# role: postfix
# file: tasks/service.yml

- name: POSTFIX | Publish validated configuration and reconcile the running master
  become: true
  become_user: root
  postfix_activate:
    operation: activate
    configuration: "{{ __postfix_configuration }}"
    indexes: >-
      {{ __postfix_tables | postfix_stale_indexes(__postfix_table_files.files,
         (__postfix_public_tables.results + __postfix_secret_tables.results) | selectattr('changed') | map(attribute='__postfix_map') | list) }}
    lookup_files: >-
      {{ __postfix_tables | postfix_reload_files(__postfix_database_queries if postfix_account_backend != 'files' else [], __postfix_ldap_names) }}
    service_manager: "{{ ansible_facts.service_mgr }}"
    backup: "{{ postfix_backup }}"

- name: POSTFIX | Enable and start the mail service
  become: true
  become_user: root
  ansible.builtin.service:
    name: postfix
    enabled: true
    state: started

- name: POSTFIX | Remove retired custom tables, indexes and LDAP credentials
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __postfix_path }}"
    state: absent
  loop: "{{ __postfix_tables | postfix_obsolete_maps(__postfix_table_files.files, __postfix_ldap_names) }}"
  loop_control:
    loop_var: __postfix_path
  diff: false

- name: POSTFIX | Remove SQL credentials when using text files
  become: true
  become_user: root
  ansible.builtin.file:
    path: "/etc/postfix/managed/{{ __postfix_map }}.cf"
    state: absent
  loop: "{{ __postfix_database_queries.keys() }}"
  loop_control:
    loop_var: __postfix_map
    label: "{{ __postfix_map }}"
  when: postfix_account_backend == 'files'
