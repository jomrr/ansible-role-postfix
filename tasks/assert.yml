---
# role: postfix
# file: tasks/assert.yml

- name: assert | Validate network, TLS, address classes and delivery policy
  ansible.builtin.assert:
    that:
      - (__postfix_listeners | length) == (postfix_listeners | length)
      - postfix_smtp_tls_protocols is not search('[\r\n\x00]') and postfix_smtpd_tls_protocols is not search('[\r\n\x00]')
      - (postfix_tls_certificate | length > 0) == (postfix_tls_private_key | length > 0)
      - not (__postfix_listeners | rejectattr('tls','equalto','none') | list) or postfix_tls_certificate | length > 0
      - postfix_provider_port > 0 and postfix_provider_port < 65536
      - postfix_interfaces | length > 0
      - postfix_message_size_limit > 0
      - __postfix_limits_overridden or postfix_mailbox_size_limit == 0 or postfix_mailbox_size_limit >= postfix_message_size_limit
      - postfix_compatibility_level is match('^[0-9]+(\.[0-9]+)*\Z')
      - postfix_smtp_bind_address is not search('[\s\x00]') and postfix_smtp_bind_address6 is not search('[\s\x00]')
      - postfix_recipient_delimiter is not search('[\s\x00]')
      - postfix_logrotate_count > 0
      - postfix_client_auth_rate_limit >= 0 and postfix_client_connection_rate_limit >= 0 and postfix_client_connection_count_limit >= 0
      - (postfix_local_domains + postfix_virtual_mailbox_domains + postfix_virtual_alias_domains + postfix_relay_domains) | unique | length ==
        (postfix_local_domains + postfix_virtual_mailbox_domains + postfix_virtual_alias_domains + postfix_relay_domains) | length
      - postfix_dovecot_lmtp_transport is match('^lmtp:(unix:|inet:|\[)')
      - postfix_outbound != 'none' or not (postfix_providers or postfix_transport_maps or postfix_relay_domains)
      - postfix_outbound == 'relayhost' or not postfix_relayhost
      - postfix_outbound != 'relayhost' or not postfix_default_provider
      - not postfix_ldap_enabled or __postfix_ldap_domains | length > 0
      - postfix_main_cf | postfix_clean_options is mapping
      - postfix_outbound != 'none' or not (postfix_tables.values() | selectattr('parameter', 'defined')
        | map(attribute='parameter') | intersect(__postfix_outbound_parameters))
      - postfix_outbound != 'none' or not (postfix_main_cf.keys() | intersect(__postfix_outbound_parameters))
    quiet: true

- name: assert | Validate relay destination and protected credentials
  ansible.builtin.assert:
    that:
      - postfix_relayhost.host is match('^[a-zA-Z0-9][a-zA-Z0-9.:-]*\Z')
      - postfix_relayhost.get('port', 25) > 0 and postfix_relayhost.get('port', 25) < 65536
      - (postfix_relayhost.get('username', '') | length > 0) == (postfix_relayhost.get('password', '') | length > 0)
      - postfix_relayhost.get('username', '') is not search('[\s:\x00]')
      - postfix_relayhost.get('password', '') is not search('[\s\x00]')
      - not postfix_relayhost.get('username') or postfix_relayhost.get('tls', 'secure') in ['secure','wrapper']
    quiet: true
  when: postfix_outbound == 'relayhost'
  no_log: true

- name: assert | Validate additional master services
  ansible.builtin.assert:
    that:
      - __postfix_service.name is match('^[A-Za-z0-9_.:\[\]-]+\Z')
      - __postfix_service.command | length > 0 and __postfix_service.command is not search('[\r\n\x00]')
      - __postfix_service.get('private', '-') in ['y','n','-'] and __postfix_service.get('chroot','n') in ['y','n','-']
      - __postfix_service.get('unprivileged','-') in ['y','n','-']
      - __postfix_service.get('wakeup','-') is match('^(-|[0-9]+[?]?)\Z')
      - __postfix_service.get('limit','-') is match('^(-|[0-9]+)\Z')
      - __postfix_service.get('options', {}) | postfix_clean_options is mapping
    quiet: true
  loop: "{{ postfix_master_cf }}"
  loop_control:
    loop_var: __postfix_service
    label: "{{ __postfix_service.name }}"

- name: assert | Validate LDAP alias and distribution lookup contracts
  ansible.builtin.assert:
    that:
      - __postfix_query.key is match('^[a-z][a-z0-9_]*\Z')
      - __postfix_query.value is mapping
      - __postfix_query.value.keys() | difference(['filter','result_attribute','special_result_attribute','leaf_result_attribute']) | length == 0
      - __postfix_query.value.filter is match('^\([^\r\n\x00]+\)\Z') and '%s' in __postfix_query.value.filter
      - __postfix_query.value.get('result_attribute', '') | length > 0 or __postfix_query.value.get('leaf_result_attribute', '') | length > 0
      - __postfix_query.value.get('result_attribute', '') == '' or __postfix_query.value.result_attribute is match('^[a-zA-Z][a-zA-Z0-9-]*\Z')
      - __postfix_query.value.get('special_result_attribute','member') is match('^[a-zA-Z][a-zA-Z0-9-]*\Z')
      - __postfix_query.value.get('leaf_result_attribute','mail') is match('^[a-zA-Z][a-zA-Z0-9-]*\Z')
    quiet: true
  loop: "{{ postfix_ldap_alias_queries | dict2items }}"
  loop_control:
    loop_var: __postfix_query
    label: "{{ __postfix_query.key }}"

- name: assert | Validate single-line configuration values
  ansible.builtin.assert:
    that:
      - __postfix_value | length > 0
      - __postfix_value is not regex('[\s\x00]')
    quiet: true
  loop: >-
    {{ [__postfix_hostname, postfix_origin, postfix_dovecot_auth_socket, postfix_dovecot_lmtp_transport,
        postfix_cyrus_sasl_path, postfix_relay_transport, postfix_smtp_helo_name]
       + postfix_interfaces + postfix_local_domains + postfix_virtual_mailbox_domains + postfix_virtual_alias_domains
       + postfix_relay_domains + postfix_ldap_address_domains + postfix_trusted_networks
       + postfix_non_smtpd_milters + postfix_tls_policy_maps + postfix_bare_newline_exclusions }}
  loop_control:
    loop_var: __postfix_value
    label: "{{ __postfix_value }}"

- name: assert | Validate managed log and certificate paths
  ansible.builtin.assert:
    that:
      - __postfix_path == '' or __postfix_path is match('^/[^\s]+$')
    quiet: true
  loop: "{{ [postfix_log_file, postfix_tls_certificate, postfix_tls_private_key, postfix_tls_ca_file, postfix_lmtp_tls_ca_file] }}"
  loop_control:
    loop_var: __postfix_path
    label: "{{ __postfix_path }}"

- name: assert | Validate queue durations
  ansible.builtin.assert:
    that:
      - __postfix_duration is match('^[1-9][0-9]*[smhdw]$')
    quiet: true
  loop: >-
    {{ [postfix_maximal_queue_lifetime, postfix_bounce_queue_lifetime, postfix_minimal_backoff_time,
        postfix_maximal_backoff_time, postfix_queue_run_delay] }}
  loop_control:
    loop_var: __postfix_duration
    label: "{{ __postfix_duration }}"

- name: assert | Validate provider references and unique transport names
  ansible.builtin.assert:
    that:
      - postfix_providers | map(attribute='name') | unique | length == postfix_providers | length
      - postfix_default_provider == '' or postfix_default_provider in postfix_providers | map(attribute='name')
      - postfix_sender_relays.values() | difference(postfix_providers | map(attribute='name')) | length == 0
    quiet: true

- name: assert | Validate provider names
  ansible.builtin.assert:
    that:
      - __postfix_name is match('^[a-z][a-z0-9_]*$')
    quiet: true
  loop: "{{ postfix_providers | map(attribute='name') }}"
  loop_control:
    loop_var: __postfix_name
    label: "{{ __postfix_name }}"

- name: assert | Validate provider hostnames
  ansible.builtin.assert:
    that:
      - __postfix_host is match('^[a-zA-Z0-9][a-zA-Z0-9.-]*$')
    quiet: true
  loop: "{{ postfix_providers | map(attribute='host') }}"
  loop_control:
    loop_var: __postfix_host
    label: "{{ __postfix_host }}"

- name: assert | Validate optional provider ports
  ansible.builtin.assert:
    that:
      - __postfix_port > 0 and __postfix_port < 65536
    quiet: true
  loop: "{{ postfix_providers | map(attribute='port', default=postfix_provider_port) }}"
  loop_control:
    loop_var: __postfix_port
    label: "{{ __postfix_port }}"

- name: assert | Validate provider credential encoding
  ansible.builtin.assert:
    that:
      - __postfix_credential | length > 0
      - __postfix_credential is not regex('[\s]')
    quiet: true
  loop: "{{ (postfix_providers | map(attribute='username')) + (postfix_providers | map(attribute='password')) }}"
  loop_control:
    loop_var: __postfix_credential
    label: Provider credential
  no_log: true

- name: assert | Validate provider login separators
  ansible.builtin.assert:
    that:
      - "':' not in __postfix_username"
    quiet: true
  loop: "{{ postfix_providers | map(attribute='username') }}"
  loop_control:
    loop_var: __postfix_username
    label: "{{ __postfix_username }}"

- name: assert | Validate LDAP endpoints and lookup parameters
  ansible.builtin.assert:
    that:
      - postfix_ldap.uris | length > 0
      - postfix_ldap.uris | reject('match', '^ldaps://([A-Za-z0-9.-]+|\[[A-Fa-f0-9:]+\])(:[0-9]+)?/?\Z') | length == 0
      - postfix_ldap.ca_file is match('^/[^\s]+\Z')
      - postfix_ldap.base | trim | length > 0 and postfix_ldap.base is not search('[\r\n\x00]')
      - postfix_ldap.bind_dn | trim | length > 0 and postfix_ldap.bind_dn is not search('[\r\n\x00]')
      - postfix_ldap.eligibility_filter is match('^\([^\r\n\x00]+\)\Z')
      - postfix_ldap.mail_attribute is match('^[a-zA-Z][a-zA-Z0-9-]*\Z')
      - postfix_ldap.login_attribute is match('^[a-zA-Z][a-zA-Z0-9-]*\Z')
    quiet: true
  when: postfix_ldap_enabled

- name: assert | Validate LDAP bind password for a single-line map setting
  ansible.builtin.assert:
    that:
      - postfix_ldap.bind_password | length > 0
      - postfix_ldap.bind_password == postfix_ldap.bind_password | trim
      - postfix_ldap.bind_password is not search('[\r\n\x00]')
    quiet: true
  when: postfix_ldap_enabled
  no_log: true

- name: assert | Validate explicit submission login keys
  ansible.builtin.assert:
    that:
      - __postfix_login is match('^(?!#)[^\s,\x00]+\Z')
    quiet: true
  loop: "{{ postfix_sasl_access_logins }}"
  loop_control:
    loop_var: __postfix_login
    label: "{{ __postfix_login }}"

- name: assert | Validate SQL query override names
  ansible.builtin.assert:
    that:
      - postfix_database_queries.keys() | difference(__postfix_database_queries.keys()) | length == 0
      - postfix_database_queries.values() | select('search', '[\r\n]') | length == 0
    quiet: true
  when: postfix_account_backend != 'files'

- name: assert | Validate SQL parameter syntax
  ansible.builtin.assert:
    that:
      - "'hosts' in postfix_database"
      - "'query' not in postfix_database"
      - postfix_database.keys() | reject('match', '^[a-zA-Z][a-zA-Z0-9_]*$') | length == 0
      - postfix_database.values() | select('search', '[\r\n]') | length == 0
    quiet: true
  no_log: true
  when: postfix_account_backend != 'files'

- name: assert | Validate recipient and sender addresses
  ansible.builtin.assert:
    that:
      - __postfix_address is match('^[^\s@,=:]+@[^\s@,=:]+$')
    quiet: true
  loop: "{{ postfix_mailboxes + (postfix_sender_logins.keys() | list) + (postfix_sender_relays.keys() | list) }}"
  loop_control:
    loop_var: __postfix_address
    label: "{{ __postfix_address }}"

- name: assert | Validate multi-value address and identity tables
  ansible.builtin.assert:
    that:
      - __postfix_entry.key is not regex('[\s:=]')
      - __postfix_entry.value is sequence and __postfix_entry.value is not string
      - __postfix_entry.value | length > 0
      - __postfix_entry.value | select('search', '[\s,]') | length == 0
    quiet: true
  loop: "{{ (postfix_sender_logins | dict2items) + (postfix_virtual_aliases | dict2items) + (postfix_local_submitters | dict2items) }}"
  loop_control:
    loop_var: __postfix_entry
    label: "{{ __postfix_entry.key }}"

- name: assert | Validate single-value routing, TLS policy and archive tables
  ansible.builtin.assert:
    that:
      - __postfix_entry.key is not regex('[\s=]')
      - __postfix_entry.value is string
      - __postfix_entry.value | length > 0
      - __postfix_entry.value is not regex('[\r\n]')
    quiet: true
  loop: >-
    {{ (postfix_transport_maps | dict2items) + (postfix_sender_bcc | dict2items)
       + (postfix_recipient_bcc | dict2items) + (postfix_local_aliases | dict2items)
       + (postfix_tls_policies | dict2items) }}
  loop_control:
    loop_var: __postfix_entry
    label: "{{ __postfix_entry.key }}"
