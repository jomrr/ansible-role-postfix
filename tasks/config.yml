---
# role: postfix
# file: tasks/config.yml

- name: config | Install main.cf
  become: true
  become_user: root
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: '0644'
    backup: "{{ postfix_backup }}"
    validate: "{{ __postfix_validate_config }} main.cf master.cf"
  notify: restart postfix

- name: config | Install master.cf
  become: true
  become_user: root
  ansible.builtin.template:
    src: master.cf.j2
    dest: /etc/postfix/master.cf
    owner: root
    group: root
    mode: '0644'
    backup: "{{ postfix_backup }}"
    validate: "{{ __postfix_validate_config }} master.cf main.cf"
  notify: restart postfix

- name: config | Protect the mail log without changing its contents
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ postfix_log_file }}"
    owner: root
    group: root
    mode: '0600'
    state: touch
    access_time: preserve
    modification_time: preserve
  when: postfix_log_file | length > 0

- name: config | Configure mail log rotation
  become: true
  become_user: root
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/ansible-postfix
    owner: root
    group: root
    mode: '0644'
    backup: "{{ postfix_backup }}"
    validate: "{{ __postfix_validate_logrotate }}"
  when: postfix_log_file | length > 0

- name: config | Remove direct log rotation when logging to syslog
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/logrotate.d/ansible-postfix
    state: absent
  when: postfix_log_file | length == 0
