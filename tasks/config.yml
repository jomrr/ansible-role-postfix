---
# role: postfix
# file: tasks/config.yml

- name: POSTFIX | Capture exactly the configuration pair to validate and publish
  ansible.builtin.set_fact:
    __postfix_configuration:
      main.cf: "{{ lookup('ansible.builtin.template', 'main.cf.j2') }}"
      master.cf: "{{ lookup('ansible.builtin.template', 'master.cf.j2') }}"
  no_log: true

- name: POSTFIX | Validate the native candidate before changing live resources
  become: true
  become_user: root
  postfix_activate:
    operation: validate
    configuration: "{{ __postfix_configuration }}"
  register: __postfix_validation

- name: POSTFIX | Validate the effective SMTP restrictions for each service
  ansible.builtin.assert:
    that: __postfix_validation.policies | postfix_valid_restrictions(__postfix_package.version is version('3.9', '<'))
    quiet: true

- name: POSTFIX | Protect the mail log without changing its contents
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ postfix_log_file }}"
    owner: root
    group: root
    mode: '0600'
    state: touch
    access_time: preserve
    modification_time: preserve
  when: postfix_log_file | length > 0

- name: POSTFIX | Configure mail log rotation
  become: true
  become_user: root
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/ansible-postfix
    owner: root
    group: root
    mode: '0644'
    backup: "{{ postfix_backup }}"
  when: postfix_log_file | length > 0

- name: POSTFIX | Remove direct log rotation when logging to syslog
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/logrotate.d/ansible-postfix
    state: absent
  when: postfix_log_file | length == 0
