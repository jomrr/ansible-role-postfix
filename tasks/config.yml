---
# role: postfix
# file: tasks/config.yml

- name: POSTFIX | Render both candidate configuration files
  become: true
  become_user: root
  ansible.builtin.template:
    src: "{{ __postfix_config }}.j2"
    dest: "{{ __postfix_stage.path }}/{{ __postfix_config }}"
    owner: root
    group: root
    mode: '0644'
    backup: false
  loop: [main.cf, master.cf]
  loop_control:
    loop_var: __postfix_config
    label: "{{ __postfix_config }}"
  changed_when: false
  check_mode: false
  diff: false

- name: POSTFIX | Check the candidate with the native Postfix package before changing live resources
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [postfix, -c, "{{ __postfix_stage.path }}", check]
  changed_when: false
  when: not ansible_check_mode

- name: POSTFIX | Parse native parameters and services without initializing spool files in check mode
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [postconf, -c, "{{ __postfix_stage.path }}", "{{ __postfix_check }}"]
  loop: [-m, -M]
  loop_control:
    loop_var: __postfix_check
  changed_when: false
  check_mode: false
  when: ansible_check_mode

- name: POSTFIX | Protect the mail log without changing its contents
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ postfix_log_file }}"
    owner: root
    group: root
    mode: '0600'
    state: touch
    access_time: preserve
    modification_time: preserve
  when: postfix_log_file | length > 0

- name: POSTFIX | Configure mail log rotation
  become: true
  become_user: root
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/ansible-postfix
    owner: root
    group: root
    mode: '0644'
    backup: "{{ postfix_backup }}"
  when: postfix_log_file | length > 0

- name: POSTFIX | Remove direct log rotation when logging to syslog
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/logrotate.d/ansible-postfix
    state: absent
  when: postfix_log_file | length == 0
