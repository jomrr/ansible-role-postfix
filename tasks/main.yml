---
# role: postfix
# file: tasks/main.yml

- name: Gather facts and load platform settings
  ansible.builtin.import_tasks: set_vars.yml

- name: Validate mail service inputs
  ansible.builtin.import_tasks: assert.yml

- name: Configure Postfix
  block:
    - name: Install Postfix and lookup drivers
      ansible.builtin.import_tasks: install.yml

    - name: Configure mail services and logging
      ansible.builtin.import_tasks: config.yml

    - name: Install tables and build native indexes
      ansible.builtin.import_tasks: tables.yml

    - name: Configure SQL and LDAP connections
      ansible.builtin.import_tasks: lookups.yml

    - name: Enable and start Postfix
      become: true
      become_user: root
      ansible.builtin.service:
        name: postfix
        enabled: true
        state: started

  always:
    - name: Apply pending Postfix changes
      ansible.builtin.meta: flush_handlers
