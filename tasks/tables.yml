---
# role: postfix
# file: tasks/tables.yml

- name: tables | Create protected lookup directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __postfix_dir }}"
    owner: root
    group: postfix
    mode: '0755'
    state: directory

- name: tables | Install indexed lookup sources
  become: true
  become_user: root
  ansible.builtin.template:
    src: table.j2
    dest: "{{ __postfix_tables[__postfix_map].path }}"
    owner: root
    group: "{{ __postfix_tables[__postfix_map].group }}"
    mode: "{{ __postfix_tables[__postfix_map].mode }}"
    backup: "{{ postfix_backup and not __postfix_tables[__postfix_map].secret and __postfix_map not in postfix_tables }}"
  loop: "{{ __postfix_tables | dict2items | selectattr('value.suffix') | map(attribute='key') }}"
  loop_control:
    loop_var: __postfix_map
  no_log: "{{ __postfix_tables[__postfix_map].secret }}"
  diff: "{{ ansible_diff_mode and not __postfix_tables[__postfix_map].secret and __postfix_map not in postfix_tables }}"
  register: __postfix_index_sources

- name: tables | Install text lookup tables
  become: true
  become_user: root
  ansible.builtin.template:
    src: table.j2
    dest: "{{ __postfix_tables[__postfix_map].path }}"
    owner: root
    group: "{{ __postfix_tables[__postfix_map].group }}"
    mode: "{{ __postfix_tables[__postfix_map].mode }}"
    backup: false
  loop: "{{ __postfix_tables | dict2items | rejectattr('value.suffix') | map(attribute='key') }}"
  loop_control:
    loop_var: __postfix_map
  no_log: "{{ __postfix_tables[__postfix_map].secret }}"
  diff: false
  notify: reload postfix

- name: tables | Read timestamps of managed sources and indexes
  become: true
  become_user: root
  ansible.builtin.find:
    paths: "{{ __postfix_dir }}"
  register: __postfix_table_files

- name: tables | Protect existing indexes before writing credentials
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __postfix_path }}"
    owner: root
    group: root
    mode: '0600'
    state: file
  loop: "{{ __postfix_tables | postfix_exposed_indexes(__postfix_table_files.files) }}"
  loop_control:
    loop_var: __postfix_path

- name: tables | Build missing, changed or stale indexes
  become: true
  become_user: root
  ansible.builtin.command:
    argv: ["{{ __postfix_index.command }}", "{{ __postfix_index.map }}"]
  loop: >-
    {{ __postfix_tables | postfix_stale_indexes(__postfix_table_files.files,
       __postfix_index_sources.results | selectattr('changed') | map(attribute='__postfix_map') | list) }}
  loop_control:
    loop_var: __postfix_index
    label: "{{ __postfix_index.map }}"
  register: __postfix_build
  changed_when: __postfix_build.rc == 0
  failed_when: __postfix_build.rc != 0

- name: tables | Remove retired custom tables, indexes and LDAP credentials
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __postfix_path }}"
    state: absent
  loop: "{{ __postfix_tables | postfix_obsolete_maps(__postfix_table_files.files, __postfix_ldap_names) }}"
  loop_control:
    loop_var: __postfix_path
  diff: false
