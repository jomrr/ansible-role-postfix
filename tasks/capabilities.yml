---
# role: postfix
# file: tasks/capabilities.yml

- name: POSTFIX | Read capabilities from the installed package in a private workspace
  become: true
  become_user: root
  postfix_activate:
    operation: discover
    setgid_group: "{{ __postfix_setgid_group }}"
  register: __postfix_package

- name: POSTFIX | Require local sender authorization and a writable native cache driver
  ansible.builtin.assert:
    that:
      - __postfix_package.version is version('3.6', '>=')
      - __postfix_cache_type | length > 0
    fail_msg: Postfix 3.6 or later and a writable LMDB, Btree or hash driver are required.
    quiet: true

- name: POSTFIX | Require native SMTP synchronization checks for network listeners
  ansible.builtin.assert:
    that:
      - "'smtpd_forbid_unauth_pipelining =' in __postfix_package.smtp_features"
      - postfix_forbid_bare_newline == 'no' or 'smtpd_forbid_bare_newline_reject_code =' in __postfix_package.smtp_features
    fail_msg: Update Postfix to a build with SMTP pipelining enforcement and the selected newline policy before enabling listeners.
    quiet: true
  when: >-
    postfix_listeners | length > 0 or
    postfix_master_cf | selectattr('type', 'equalto', 'inet') | selectattr('command', 'in', ['smtpd', 'postscreen']) | length > 0

- name: POSTFIX | Check the selected SMTP server authentication driver
  ansible.builtin.assert:
    that: postfix_sasl_type in __postfix_package.sasl
    quiet: true
  when: __postfix_listeners | selectattr('auth', 'equalto', 'required') | length > 0
