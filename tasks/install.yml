---
# role: postfix
# file: tasks/install.yml

- name: POSTFIX | Install mail service and lookup drivers
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __postfix_packages + __postfix_backend_packages[postfix_account_backend] + (['postfix-ldap'] if postfix_ldap_enabled else [])
             + (__postfix_pcre_packages if postfix_tables.values() | selectattr('type', 'defined') | selectattr('type', 'equalto', 'pcre') | length else []) }}"
    state: present
    policy_rc_d: "{{ 101 if ansible_facts.pkg_mgr == 'apt' else omit }}"

- name: POSTFIX | Read compiled map type, version and native proxy map list
  ansible.builtin.command:
    argv: [postconf, -d, -h, default_database_type, mail_version, proxy_read_maps]
  register: __postfix_native
  changed_when: false
  check_mode: false

- name: POSTFIX | Read interface settings before replacing the configuration
  ansible.builtin.command:
    argv: [postconf, -h, inet_interfaces, inet_protocols]
  register: __postfix_previous_network
  failed_when: >-
    __postfix_previous_network.rc != 0 and
    __postfix_previous_network.stderr is not search('fatal: parameter inet_(interfaces|protocols):')
  changed_when: false
  check_mode: false

- name: POSTFIX | Recover an unusable package network setting before opening native maps
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [postconf, -e, "inet_interfaces = {{ __postfix_desired_network[0] }}", "inet_protocols = {{ __postfix_desired_network[1] }}"]
  when: __postfix_previous_network.rc != 0
  changed_when: true
  notify: reload postfix

- name: POSTFIX | Discover the lookup drivers shipped by the installed package
  ansible.builtin.command:
    argv: [postconf, -m]
  register: __postfix_drivers
  changed_when: false
  check_mode: false

- name: POSTFIX | Require support for local sender authorization
  ansible.builtin.assert:
    that: __postfix_native.stdout_lines[1] is version('3.6', '>=')
    quiet: true

- name: POSTFIX | Detect native bare-newline enforcement on this package build
  ansible.builtin.command:
    argv: [postconf, -d, -h, smtpd_forbid_bare_newline_reject_code]
  register: __postfix_newline_support
  changed_when: false
  check_mode: false

- name: POSTFIX | Require a patched SMTP server for the selected newline policy
  ansible.builtin.assert:
    that: __postfix_newline_support.stdout | length > 0
    fail_msg: Update Postfix to a build supporting normalize and reject before enabling SMTP listeners.
    quiet: true
  when: postfix_listeners | length > 0 and postfix_forbid_bare_newline != 'no'

- name: POSTFIX | Check the selected SMTP server authentication driver
  ansible.builtin.command:
    argv: [postconf, -a]
  register: __postfix_sasl_drivers
  changed_when: false
  check_mode: false
  failed_when: __postfix_sasl_drivers.rc != 0 or postfix_sasl_type not in __postfix_sasl_drivers.stdout_lines
  when: __postfix_listeners | selectattr('auth', 'equalto', 'required') | length > 0
