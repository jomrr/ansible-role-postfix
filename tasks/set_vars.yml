---
# role: postfix
# file: tasks/set_vars.yml

- name: set_vars | Gather missing facts
  ansible.builtin.setup:
    gather_subset: "{{ __postfix_required_facts_subsets }}"
  when: __postfix_required_facts | difference(ansible_facts.keys()) | length > 0

- name: set_vars | Load platform settings
  ansible.builtin.include_vars: "{{ __postfix_vars_file }}"
  loop: "{{ [ansible_facts.system, ansible_facts.os_family, ansible_facts.distribution] | unique }}"
  loop_control:
    loop_var: __postfix_platform
  vars:
    __postfix_vars_file: "{{ role_path }}/vars/{{ __postfix_platform }}.yml"
  when: __postfix_vars_file is file
