---
# role: postfix
# file: vars/Linux.yml

# Validate the proposed file with its installed companion. Pass paths as shell arguments.
__postfix_validate_config: >-
  sh -c 'd=$(mktemp -d) || exit 1;
  cp "$1" "$d/$2" && cp "/etc/postfix/$3" "$d/$3" && postfix -c "$d" check
  {% if __postfix_limits_overridden %}
  && limits=$(postconf -c "$d" -xh mailbox_size_limit message_size_limit) && { set -f; set -- $limits;
  [ "$1" -eq 0 ] || [ "$1" -ge "$2" ] || { echo "mailbox_size_limit must be zero or at least message_size_limit" >&2; false; }; }
  {% endif %};
  rc=$?; rm -rf "$d"; exit "$rc"' sh "%s"
__postfix_validate_logrotate: logrotate -d -s /dev/null %s
