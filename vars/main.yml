---
# role: postfix
# file: vars/main.yml

__postfix_required_facts: [fqdn, system, os_family, distribution, pkg_mgr, service_mgr]
__postfix_required_facts_subsets: ['!all', '!min', platform, distribution, pkg_mgr, service_mgr]
__postfix_hostname: "{{ postfix_hostname | default(ansible_facts.fqdn | default(inventory_hostname)) }}"
__postfix_limits_overridden: "{{ 'mailbox_size_limit' in postfix_main_cf or 'message_size_limit' in postfix_main_cf }}"

__postfix_packages: >-
  {{ __postfix_base_packages
     + __postfix_backend_packages[postfix_account_backend]
     + (['postfix-ldap'] if postfix_ldap_enabled else [])
     + (['postfix-pcre'] if 'pcre' in postfix_tables.values() | map(attribute='type', default='native') else []) }}

__postfix_dir: /etc/postfix/managed
__postfix_sender_reject: REJECT Sender address requires authenticated submission
__postfix_protected_domains: >-
  {{ (postfix_local_domains + postfix_virtual_mailbox_domains + postfix_virtual_alias_domains
      + (postfix_ldap_address_domains if postfix_ldap_enabled else [])) | unique }}
__postfix_listeners: >-
  {{ postfix_listeners | postfix_listener_services(postfix_outbound, postfix_main_cf.get('smtpd_discard_ehlo_keywords', '')) }}
__postfix_provider_tables: >-
  {{ postfix_providers | postfix_provider_tables(postfix_sender_relays, postfix_provider_port, postfix_default_provider, postfix_relayhost) }}
__postfix_builtin_tables:
  local_aliases:
    parameter: alias_maps
    entries: "{{ postfix_local_aliases }}"
    aliases: true
    mode: '0644'
  local_senders:
    parameter: local_login_sender_maps
    entries: "{{ postfix_local_submitters }}"
    mode: '0644'
  mailboxes:
    parameter: virtual_mailbox_maps
    entries: "{{ dict(postfix_mailboxes | zip_longest([], fillvalue='OK')) }}"
  virtual_aliases:
    parameter: virtual_alias_maps
    entries: "{{ postfix_virtual_aliases }}"
  senders:
    parameter: smtpd_sender_login_maps
    entries: "{{ postfix_sender_logins }}"
  protected_senders:
    parameter: "{{ 'managed_protected_map' if __postfix_listeners | selectattr('protect') | length else '' }}"
    entries: >-
      {{ dict((postfix_mailboxes + (postfix_sender_logins | list))
         | zip_longest([], fillvalue=__postfix_sender_reject)) }}
  sender-domain:
    type: regexp
    entries: {'/@([^@]+)$/': '$1'}
  sasl_access:
    parameter: "{{ 'managed_sasl_map' if postfix_sasl_access_enabled and __postfix_listeners | selectattr('auth', 'equalto', 'required') | length else '' }}"
    entries: "{{ dict(postfix_sasl_access_logins | zip_longest([], fillvalue='OK')) }}"
  sender_relay:
    parameter: sender_dependent_relayhost_maps
    entries: "{{ __postfix_provider_tables.sender_relay }}"
  sender_transport:
    parameter: sender_dependent_default_transport_maps
    entries: "{{ __postfix_provider_tables.sender_transport }}"
  sasl_passwd:
    parameter: smtp_sasl_password_maps
    entries: "{{ __postfix_provider_tables.sasl_passwd }}"
    secret: true
  sender_bcc:
    parameter: sender_bcc_maps
    entries: "{{ postfix_sender_bcc }}"
  recipient_bcc:
    parameter: recipient_bcc_maps
    entries: "{{ postfix_recipient_bcc }}"
  transport:
    parameter: transport_maps
    entries: "{{ postfix_transport_maps }}"
  tls_policy:
    parameter: smtp_tls_policy_maps
    entries: "{{ postfix_tls_policies }}"
  relay_recipients:
    parameter: relay_recipient_maps
    entries: "{{ dict(postfix_relay_recipients | zip_longest([], fillvalue='OK')) }}"

__postfix_tables: "{{ __postfix_builtin_tables | postfix_table_catalog(postfix_tables, __postfix_table_type) }}"
__postfix_map_parameters: >-
  {{ __postfix_tables | postfix_map_parameters(postfix_account_backend, postfix_ldap_enabled, postfix_ldap_alias_queries, postfix_tls_policy_maps) }}
__postfix_ldap_domains: "{{ (postfix_virtual_mailbox_domains + postfix_virtual_alias_domains + postfix_ldap_address_domains) | unique }}"
__postfix_ldap_names: >-
  {{ (__postfix_ldap_maps | selectattr('enabled') | map(attribute='name') | list)
     + (postfix_ldap_alias_queries | map('regex_replace', '^', 'alias-') | list if postfix_ldap_enabled else []) }}

__postfix_ldap_maps:
  - name: mailboxes
    enabled: "{{ postfix_ldap_enabled }}"
    key: mail_attribute
    result: mail_attribute
    format: '%s'
  - name: senders
    enabled: "{{ postfix_ldap_enabled }}"
    key: mail_attribute
    result: login_attribute
    format: '%s'
  - name: sasl_access
    enabled: "{{ postfix_ldap_enabled and postfix_sasl_access_enabled }}"
    key: login_attribute
    result: login_attribute
    format: OK

__postfix_database_queries:
  domains: >-
    SELECT domain FROM domain WHERE domain='%s' AND active=TRUE AND backupmx=FALSE
    UNION SELECT ad.alias_domain FROM alias_domain ad JOIN domain d ON d.domain=ad.target_domain
    WHERE ad.alias_domain='%s' AND ad.active=TRUE AND d.active=TRUE AND d.backupmx=FALSE
  mailboxes: >-
    SELECT m.username FROM mailbox m JOIN domain d ON d.domain=m.domain
    WHERE m.username='%s' AND m.active=TRUE AND d.active=TRUE AND d.backupmx=FALSE
  virtual_aliases: >-
    SELECT a.goto FROM alias a JOIN domain d ON d.domain=a.domain
    WHERE a.address='%s' AND a.active=TRUE AND d.active=TRUE AND d.backupmx=FALSE
  alias_domains: >-
    SELECT a.goto FROM alias a JOIN alias_domain ad ON a.domain=ad.target_domain
    JOIN domain d ON d.domain=ad.target_domain WHERE ad.alias_domain='%d'
    AND a.address=CONCAT('%u','@',ad.target_domain) AND a.active=TRUE AND ad.active=TRUE
    AND d.active=TRUE AND d.backupmx=FALSE
  alias_domain_catchalls: >-
    SELECT a.goto FROM alias a JOIN alias_domain ad ON a.domain=ad.target_domain
    JOIN domain d ON d.domain=ad.target_domain WHERE ad.alias_domain='%d'
    AND a.address=CONCAT('@',ad.target_domain) AND a.active=TRUE AND ad.active=TRUE
    AND d.active=TRUE AND d.backupmx=FALSE
  senders: >-
    SELECT m.username FROM mailbox m JOIN domain d ON d.domain=m.domain
    WHERE m.username='%s' AND m.active=TRUE AND d.active=TRUE AND d.backupmx=FALSE
    UNION SELECT a.goto FROM alias a JOIN domain d ON d.domain=a.domain
    WHERE a.address='%s' AND a.active=TRUE AND d.active=TRUE AND d.backupmx=FALSE
  alias_domain_senders: >-
    SELECT a.goto FROM alias a JOIN alias_domain ad ON a.domain=ad.target_domain
    JOIN domain d ON d.domain=ad.target_domain WHERE ad.alias_domain='%d'
    AND a.address=CONCAT('%u','@',ad.target_domain) AND a.active=TRUE AND ad.active=TRUE
    AND d.active=TRUE AND d.backupmx=FALSE
  protected_senders: >-
    SELECT '{{ __postfix_sender_reject }}' FROM domain WHERE domain='%d' AND active=TRUE AND backupmx=FALSE
    UNION SELECT '{{ __postfix_sender_reject }}' FROM alias_domain ad JOIN domain d ON d.domain=ad.target_domain
    WHERE ad.alias_domain='%d' AND ad.active=TRUE AND d.active=TRUE AND d.backupmx=FALSE

__postfix_outbound_parameters:
  - default_transport
  - relay_transport
  - transport_maps
  - relayhost
  - relay_domains
  - sender_dependent_default_transport_maps
  - sender_dependent_relayhost_maps
