---
# role: postfix
# file: vars/RedHat.yml

__postfix_base_packages: [postfix, cyrus-sasl-plain, ca-certificates, logrotate]
__postfix_backend_packages:
  files: []
  mysql: [postfix-mysql]
  pgsql: [postfix-pgsql]
__postfix_ca_file: /etc/pki/tls/certs/ca-bundle.crt
__postfix_setgid_group: postdrop

__postfix_table_type: lmdb
__postfix_cache_type: lmdb
