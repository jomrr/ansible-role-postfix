---
# role: postfix
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/molecule/resources/requirements.yml"
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/molecule/resources/requirements.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
    connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        ansible_podman_mount_detection: false
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "side_effect"
    - "converge"
    - "check"
    - "verify"
    - "destroy"
  name: "default"
platforms:
  - pre_build_image: true
    override_command: false
    systemd: "true"
    groups:
      - "postfix_servers"
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    name: "postfix"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
  - name: "postfix-${MOLECULE_SCENARIO_NAME}-mysql"
    image: "docker.io/library/mariadb:11.4"
    pre_build_image: true
    override_command: false
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "postfix_mysql"
    env:
      MARIADB_ROOT_PASSWORD: "molecule-database-secret"
      MARIADB_DATABASE: "postfixadmin"
  - name: "postfix-${MOLECULE_SCENARIO_NAME}-pgsql"
    image: "docker.io/library/postgres:16-alpine"
    pre_build_image: true
    override_command: false
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "postfix_pgsql"
    env:
      POSTGRES_PASSWORD: "molecule-database-secret"
      POSTGRES_DB: "postfixadmin"
  - name: "pdc-${MOLECULE_SCENARIO_NAME}.example.test"
    hostname: "pdc-${MOLECULE_SCENARIO_NAME}"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--uidmap=0:0:10000"
      - "--uidmap=60000:10000:40000"
      - "--gidmap=0:0:10000"
      - "--gidmap=60000:10000:40000"
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "postfix_directory"
