---
# role: postfix
# file: molecule/resources/playbooks/verify.yml

- name: POSTFIX | Verify return to a closed default installation
  hosts: postfix_servers
  gather_facts: false
  tasks:
    - name: POSTFIX | Verify the running service and closed network policy
      become: true
      become_user: root
      ansible.builtin.command:
        argv: [python3, /etc/postfix-test/operating_modes.py, closed]
      changed_when: false
