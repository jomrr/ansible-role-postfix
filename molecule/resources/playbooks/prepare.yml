---
# role: postfix
# file: molecule/resources/playbooks/prepare.yml

- name: POSTFIX | Prepare mail service integration fixtures
  hosts: postfix_servers
  gather_facts: true
  vars:
    __postfix_fixture_packages:
      Debian: [dovecot-core, dovecot-lmtpd, python3-cryptography]
      RedHat: [dovecot, python3-cryptography]
      Suse: [dovecot, python3-cryptography]
  tasks:
    - name: POSTFIX | Refresh APT package metadata
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.pkg_mgr == 'apt'

    - name: POSTFIX | Refresh RPM package metadata
      become: true
      become_user: root
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

    - name: POSTFIX | Refresh SUSE package metadata
      become: true
      become_user: root
      community.general.zypper_repository:
        repo: '*'
        runrefresh: true
      when: ansible_facts.pkg_mgr == 'zypper'

    - name: POSTFIX | Install authentication and certificate fixtures
      become: true
      become_user: root
      ansible.builtin.package:
        name: "{{ __postfix_fixture_packages[ansible_facts.os_family] }}"
        state: present

    - name: POSTFIX | Create the fixture mailbox group
      become: true
      become_user: root
      ansible.builtin.group:
        name: postfix_test
        gid: 5010

    - name: POSTFIX | Create the fixture mailbox owner
      become: true
      become_user: root
      ansible.builtin.user:
        name: postfix_test
        uid: 5010
        group: postfix_test
        create_home: false

    - name: POSTFIX | Create fixture directories
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ __postfix_directory }}"
        state: directory
        mode: '0755'
      loop: [/etc/postfix-test, /var/lib/postfix-test]
      loop_control:
        loop_var: __postfix_directory

    - name: POSTFIX | Create fixture mailbox homes
      become: true
      become_user: root
      ansible.builtin.file:
        path: "/var/lib/postfix-test/{{ __postfix_user }}"
        state: directory
        owner: postfix_test
        group: postfix_test
        mode: '0700'
      loop: [alice, bob, archive]
      loop_control:
        loop_var: __postfix_user

    - name: POSTFIX | Create the test TLS private key
      become: true
      become_user: root
      community.crypto.openssl_privatekey:
        path: /etc/postfix-test/server.key

    - name: POSTFIX | Create the test certificate request
      become: true
      become_user: root
      community.crypto.openssl_csr:
        path: /etc/postfix-test/server.csr
        privatekey_path: /etc/postfix-test/server.key
        common_name: localhost
        subject_alt_name: [DNS:localhost]

    - name: POSTFIX | Create the test TLS certificate
      become: true
      become_user: root
      community.crypto.x509_certificate:
        path: /etc/postfix-test/server.crt
        csr_path: /etc/postfix-test/server.csr
        privatekey_path: /etc/postfix-test/server.key
        provider: selfsigned

    - name: POSTFIX | Configure Dovecot fixture accounts
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/dovecot/postfix-users
        owner: root
        group: dovecot
        mode: '0640'
        content: |
          alice@example.test:{PLAIN}alice-secret:5010:5010::/var/lib/postfix-test/alice::
          bob@example.test:{PLAIN}bob-secret:5010:5010::/var/lib/postfix-test/bob::
          archive@example.test:{PLAIN}archive-secret:5010:5010::/var/lib/postfix-test/archive::

    - name: POSTFIX | Read the fixture Dovecot version
      ansible.builtin.command:
        argv: [dovecot, --version]
      register: __postfix_dovecot_version
      changed_when: false

    - name: POSTFIX | Configure the Dovecot authentication and delivery fixtures
      become: true
      become_user: root
      ansible.builtin.template:
        src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/resources/templates/dovecot.conf.j2"
        dest: /etc/dovecot/dovecot.conf
        owner: root
        group: root
        mode: '0644'
        validate: doveconf -c %s -n

    - name: POSTFIX | Start the Dovecot fixture
      become: true
      become_user: root
      ansible.builtin.service:
        name: dovecot
        state: restarted

- name: POSTFIX | Prepare PostfixAdmin database fixtures
  hosts: localhost
  gather_facts: false
  vars:
    __postfix_schema: "{{ lookup('ansible.builtin.file', '../tests/postfixadmin.sql') }}"
  tasks:
    - name: POSTFIX | Initialize the MariaDB fixture
      containers.podman.podman_container_exec:
        name: "postfix-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-mysql"
        argv: [mariadb, -uroot, -pmolecule-database-secret, postfixadmin, -e, "{{ __postfix_schema }}"]
      register: __postfix_mysql_init
      until: __postfix_mysql_init.rc == 0
      retries: 20
      delay: 3
      no_log: true

    - name: POSTFIX | Initialize the PostgreSQL fixture
      containers.podman.podman_container_exec:
        name: "postfix-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-pgsql"
        argv: [psql, -U, postgres, -d, postfixadmin, -v, ON_ERROR_STOP=1, -c, "{{ __postfix_schema }}"]
      register: __postfix_pgsql_init
      until: __postfix_pgsql_init.rc == 0
      retries: 20
      delay: 3
