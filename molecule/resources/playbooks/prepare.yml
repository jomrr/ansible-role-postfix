---
# role: postfix
# file: molecule/resources/playbooks/prepare.yml

- name: Run the role's Python unit tests on the controller
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Exercise listener and lookup routing
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", -m, unittest, discover, -s, tests/unit]
        chdir: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      register: __postfix_unit_tests
      changed_when: false
      failed_when: __postfix_unit_tests.rc != 0

- name: Prepare the shared AD directory
  hosts: postfix_directory
  gather_facts: false
  tasks:
    - name: Provision the LDAP test directory
      ansible.builtin.import_tasks: ../tasks/directory.yml

- name: Prepare mail service integration fixtures
  hosts: postfix_servers
  gather_facts: true
  tasks:
    - name: Refresh APT package metadata
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.pkg_mgr == 'apt'

    - name: Refresh RPM package metadata
      become: true
      become_user: root
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

    - name: Refresh SUSE package metadata
      become: true
      become_user: root
      community.general.zypper_repository:
        repo: '*'
        runrefresh: true
      when: ansible_facts.pkg_mgr == 'zypper'

    - name: Install the TLS fixture tool
      become: true
      become_user: root
      ansible.builtin.package:
        name: openssl

    - name: Create the fixture mailbox group
      become: true
      become_user: root
      ansible.builtin.group:
        name: postfix_test
        gid: 5010

    - name: Create the fixture mailbox owner
      become: true
      become_user: root
      ansible.builtin.user:
        name: postfix_test
        uid: 5010
        group: postfix_test
        create_home: false

    - name: Create fixture directories
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ __postfix_directory }}"
        state: directory
        mode: '0755'
      loop: [/etc/postfix-test, /var/lib/postfix-test]
      loop_control:
        loop_var: __postfix_directory
        label: "{{ __postfix_directory }}"

    - name: Install the shared SMTP client helper
      become: true
      become_user: root
      ansible.builtin.copy:
        src: ../tests/smtp_client.py
        dest: /etc/postfix-test/smtp_client.py
        mode: '0644'

    - name: Trust the directory fixture CA for LDAP lookups
      become: true
      become_user: root
      ansible.builtin.copy:
        content: "{{ hostvars[groups.postfix_directory[0]].__postfix_directory_ca.content | b64decode }}"
        dest: /etc/postfix-test/ldap-ca.pem
        mode: '0644'

    - name: Create the disposable localhost certificate and key
      become: true
      become_user: root
      ansible.builtin.command:
        argv: [openssl, req, -x509, -newkey, 'rsa:2048', -nodes, -days, '2', -subj, /CN=localhost,
               -addext, 'subjectAltName=DNS:localhost', -keyout, /etc/postfix-test/server.key, -out, /etc/postfix-test/server.crt]
        creates: /etc/postfix-test/server.crt
      register: __postfix_certificate
      changed_when: __postfix_certificate.changed
      failed_when: __postfix_certificate.rc != 0

- name: Prepare PostfixAdmin in the official database containers
  hosts: postfix_mysql:postfix_pgsql
  gather_facts: false
  vars:
    __postfix_db_command: "{{ 'mariadb -uroot -pmolecule-database-secret postfixadmin -e' if 'postfix_mysql' in group_names
                              else 'psql -U postgres -d postfixadmin -v ON_ERROR_STOP=1 -c' }}"
  tasks:
    - name: Load the test schema through the database image's native client
      ansible.builtin.raw: >-
        {{ __postfix_db_command }} {{ lookup('ansible.builtin.file', '../tests/postfixadmin.sql') | quote }}
      register: __postfix_db_init
      until: __postfix_db_init.rc == 0
      retries: 20
      delay: 3
      changed_when: true
      no_log: true
