---
# role: postfix
# file: molecule/resources/playbooks/side_effect.yml

- name: POSTFIX | Exercise SQL backends and configuration recovery
  hosts: postfix_servers
  gather_facts: true
  vars:
    postfix_ldap:
      uris: ["ldaps://{{ groups['postfix_directory'][0] }}"]
      bind_dn: CN=postfix-reader,CN=Users,DC=example,DC=test
      bind_password: 'Molecule-Bind-123!'
      base: DC=example,DC=test
      ca_file: /etc/postfix-test/ldap-ca.pem
      eligibility_filter: "(&(objectClass=user)(memberOf=CN=MailUsers,CN=Users,DC=example,DC=test)\
        (!(userAccountControl:1.2.840.113556.1.4.803:=2)))"
      mail_attribute: mail
      login_attribute: userPrincipalName
  tasks:
    - name: POSTFIX | Exercise each PostfixAdmin backend
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend.yml"
      loop: [mysql, pgsql]
      loop_control:
        loop_var: __postfix_backend

    - name: POSTFIX | Explicitly allow trusted unauthenticated reception
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        postfix_account_backend: files
        postfix_ldap_enabled: true
        postfix_smtp_auth_required: false
        postfix_fetchmail_auth_required: false

    - name: POSTFIX | Verify explicit unauthenticated reception exceptions
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: ../tests/smtp_checks.py --trusted-reception
        executable: python3
      changed_when: false

    - name: POSTFIX | Introduce an outdated address permission
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/postfix/managed/senders
        content: "alice@example.test intruder@example.test\n"
        owner: root
        group: postfix
        mode: '0640'

    - name: POSTFIX | Compile the outdated address permission
      become: true
      become_user: root
      ansible.builtin.command:
        argv: [postmap, /etc/postfix/managed/senders]
      changed_when: true

    - name: POSTFIX | Stop the service before the recovery convergence
      become: true
      become_user: root
      ansible.builtin.service:
        name: postfix
        state: stopped
