---
# role: postfix
# file: molecule/resources/playbooks/side_effect.yml

- name: Exercise the closed installation and native map indexes
  hosts: postfix_servers
  gather_facts: false
  environment:
    PYTHONPATH: /etc/postfix-test
  tasks:
    - name: Start recovery with an empty fact cache
      ansible.builtin.meta: clear_facts

    - name: Exercise the default delivery and index lifecycle
      ansible.builtin.import_tasks: ../tasks/recovery.yml

- name: Install the real Dovecot authentication and delivery services
  hosts: postfix_servers
  gather_facts: true
  vars_files: [../vars/dovecot.yml, ../vars/directory.yml]
  tasks:
    - name: Configure the Dovecot test service
      ansible.builtin.include_role:
        name: jomrr.postfix_test_dovecot_24

- name: Exercise SMTP operating modes on the installed servers
  hosts: postfix_servers
  gather_facts: true
  environment:
    PYTHONPATH: /etc/postfix-test
  vars_files: [../vars/mail.yml, ../vars/directory.yml]
  vars:
    postfix_ldap_alias_queries:
      addresses:
        filter: "(&(objectClass=user)(memberOf=CN=MailUsers,CN=Users,DC=example,DC=test)(proxyAddresses=smtp:%s))"
        result_attribute: mail
      lists:
        filter: "(&(objectClass=group)(mail=%s))"
        special_result_attribute: member
        leaf_result_attribute: mail
  tasks:
    - name: Exercise each SQL backend and the AD lookup chain
      ansible.builtin.include_tasks: ../tasks/backend.yml
      loop: [mysql, pgsql]
      loop_control:
        loop_var: __postfix_backend
        label: "{{ __postfix_backend }}"

    - name: Exercise MX, source relay, gateway and internal submission
      ansible.builtin.import_tasks: ../tasks/modes.yml

- name: Exercise a null client without network listeners
  hosts: postfix_servers
  gather_facts: true
  environment:
    PYTHONPATH: /etc/postfix-test
  tasks:
    - name: Configure and test the smarthost
      ansible.builtin.import_tasks: ../tasks/null_client.yml
