---
# role: postfix
# file: molecule/resources/tasks/backend.yml

- name: POSTFIX | Apply the SQL account backend
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  vars:
    postfix_account_backend: "{{ __postfix_backend }}"
    postfix_database:
      hosts: "postfix-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-{{ __postfix_backend }}"
      dbname: postfixadmin
      user: "{{ 'root' if __postfix_backend == 'mysql' else 'postgres' }}"
      password: molecule-database-secret

- name: POSTFIX | Verify disabled records and protected SQL sender lookups
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [postmap, -q, "{{ __postfix_lookup.address }}", "{{ __postfix_backend }}:/etc/postfix/managed/{{ __postfix_lookup.map }}.cf"]
  loop:
    - {map: domains, address: disabled.test, expected: ''}
    - {map: domains, address: backup.test, expected: ''}
    - {map: domains, address: disabled-alias.test, expected: ''}
    - {map: mailboxes, address: disabled@example.test, expected: ''}
    - {map: alias_domains, address: unknown@alias.test, expected: ''}
    - {map: protected_senders, address: alice@example.test, expected: REJECT Sender address requires authenticated submission}
    - {map: protected_senders, address: alice@alias.test, expected: REJECT Sender address requires authenticated submission}
    - {map: protected_senders, address: unknown@alias.test, expected: ''}
  loop_control:
    loop_var: __postfix_lookup
    label: "{{ __postfix_lookup.map }}:{{ __postfix_lookup.address }}"
  register: __postfix_lookup_result
  changed_when: false
  failed_when: __postfix_lookup_result.stdout != __postfix_lookup.expected or __postfix_lookup_result.rc not in [0, 1]

- name: POSTFIX | Exercise SQL-backed authentication policy and delivery
  become: true
  become_user: root
  ansible.builtin.script:
    cmd: ../tests/smtp_checks.py --accounts
    executable: python3
  changed_when: false
