---
# role: postfix
# file: molecule/resources/tasks/null_client.yml

- name: POSTFIX | Route all mail through the verified null-client relay
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  vars:
    postfix_hostname: node.example.test
    postfix_local_domains: []
    postfix_outbound: relayhost
    postfix_relayhost: {host: localhost, port: 1587, tls: secure, username: provider-a, password: relay-a-secret}
    postfix_tls_ca_file: /etc/postfix-test/server.crt

- name: POSTFIX | Exercise TLS smarthost delivery from local sendmail
  become: true
  become_user: root
  ansible.builtin.script:
    executable: python3
    cmd: ../tests/smtp_checks.py --null-client
  changed_when: false
