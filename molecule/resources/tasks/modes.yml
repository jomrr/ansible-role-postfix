---
# role: postfix
# file: molecule/resources/tasks/modes.yml

- name: POSTFIX | Exercise independent screened listeners and a text-only ACL update
  vars:
    postfix_outbound: relayhost
    postfix_relayhost: {host: 127.0.0.1, port: 1590, tls: may}
    postfix_ldap_enabled: true
    postfix_interfaces: [all]
    postfix_trusted_networks: [127.0.0.1/32]
    postfix_relay_domains: ["{{ groups['postfix_directory'][0] }}"]
    postfix_relay_recipients: ["known@{{ groups['postfix_directory'][0] }}"]
    postfix_relay_transport: 'relay:[127.0.0.1]:1590'
    postfix_tables:
      screen_acl: {type: cidr, entries: {'127.0.0.2/32': "{{ __postfix_screen_rule }}"}}
      clients: {type: native, entries: {blocked@outside.test: REJECT}}
    postfix_listeners:
      smtp: {port: 25, auth: none, tls: may, relay: none, mx: true, postscreen: true, greet_wait: 1s}
      monitor:
        address: 127.0.0.1
        port: 2527
        auth: none
        tls: may
        relay: none
        mx: true
        postscreen: true
        options:
          postscreen_greet_action: ignore
          postscreen_dnsbl_action: ignore
          postscreen_denylist_action: drop
          postscreen_access_list: $managed_table_screen_acl
      submission: {port: 1588}
      fetchmail: {port: 2525, address: 127.0.0.1, auth: none, tls: none, relay: none, clients: [127.0.0.1/32], sender_login_match: false}
      applications:
        port: 2526
        address: 127.0.0.1
        auth: none
        tls: none
        relay: clients
        clients: [127.0.0.1/32]
        sender_login_match: false
        sender_restrictions: [application_senders]
        options:
          smtpd_restriction_classes: application_senders
          application_senders: check_sender_access $managed_table_clients
  block:
    - name: POSTFIX | Configure a public MX, source relay and internal delivery listener
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        __postfix_screen_rule: permit

    - name: POSTFIX | Exercise simultaneous screened listeners and their MX defaults
      ansible.builtin.script:
        cmd: ../tests/screened_mx.py permit
        executable: python3
      register: __postfix_master_before_acl
      changed_when: false

    - name: POSTFIX | Change the CIDR table through the role
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        __postfix_screen_rule: reject

    - name: POSTFIX | Verify that new connections see the updated in-memory policy
      ansible.builtin.script:
        cmd: ../tests/screened_mx.py reject
        executable: python3
      register: __postfix_master_after_acl
      changed_when: false
      failed_when: __postfix_master_after_acl.rc != 0 or __postfix_master_after_acl.stdout != __postfix_master_before_acl.stdout

- name: POSTFIX | Exercise public reception and LDAP mailbox delivery
  become: true
  become_user: root
  ansible.builtin.script:
    executable: python3
    cmd: ../tests/smtp_checks.py --trusted-reception {{ groups['postfix_directory'][0] | quote }}
  changed_when: false

- name: POSTFIX | Exercise source-restricted relay, gateway and custom table
  become: true
  become_user: root
  ansible.builtin.script:
    executable: python3
    cmd: ../tests/operating_modes.py gateway --domain {{ groups['postfix_directory'][0] | quote }}
  changed_when: false

- name: POSTFIX | Exercise Sieve local sendmail return path
  become: true
  become_user: root
  ansible.builtin.script:
    executable: python3
    cmd: ../tests/operating_modes.py vacation --user alice
  changed_when: false

- name: POSTFIX | Point the real Dovecot test service at the internal SMTP listener
  become: true
  become_user: root
  ansible.builtin.lineinfile:
    path: /etc/dovecot/dovecot.conf
    regexp: '^submission_host\s*='
    line: submission_host = 127.0.0.1:2526
    insertafter: EOF
    validate: doveconf -c %s -n

- name: POSTFIX | Reload the Dovecot test service with SMTP submission
  become: true
  become_user: root
  ansible.builtin.service:
    name: dovecot
    state: reloaded

- name: POSTFIX | Exercise Sieve SMTP return path from the trusted service
  become: true
  become_user: root
  ansible.builtin.script:
    executable: python3
    cmd: ../tests/operating_modes.py vacation --user archive
  changed_when: false

- name: POSTFIX | Configure a local-only authenticated mail hub
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  vars:
    postfix_outbound: none
    postfix_providers: []
    postfix_sender_relays: {}
    postfix_listeners:
      submission: {port: 1588}

- name: POSTFIX | Verify restricted authenticated submission and listener isolation
  become: true
  become_user: root
  ansible.builtin.script:
    executable: python3
    cmd: ../tests/operating_modes.py hub
  changed_when: false

- name: POSTFIX | Exercise handler dispatch after a later configuration error
  block:
    - name: POSTFIX | Change the SMTP banner and request a duplicate master service
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        postfix_main_cf: {smtpd_banner: '$myhostname ESMTP molecule-flush'}
        postfix_master_cf: [{name: pickup, type: unix, command: pickup}]

    - name: POSTFIX | Flag unexpected acceptance of a duplicate master service
      ansible.builtin.fail:
        msg: Postfix accepted a duplicate pickup service.

  rescue:
    - name: POSTFIX | Verify the failure occurred while rendering master.cf
      ansible.builtin.assert:
        that: "'Duplicate master.cf service pickup/unix' in ansible_failed_result.msg"
        quiet: true

    - name: POSTFIX | Verify the running listener already serves the new banner
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 1588
        search_regex: '^220 .*ESMTP molecule-flush'
        timeout: 10
