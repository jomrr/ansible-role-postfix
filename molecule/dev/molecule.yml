---
# role: postfix
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        ansible_podman_mount_detection: false
      postfix_servers:
        postfix_hostname: "mail.example.test"
        postfix_protocols: "ipv4"
        postfix_submission_enabled: true
        postfix_submission_port: 1588
        postfix_submissions_enabled: true
        postfix_submissions_port: 1466
        postfix_fetchmail_enabled: true
        postfix_dovecot_auth_socket: "/var/lib/postfix-test/auth"
        postfix_dovecot_lmtp_transport: "lmtp:unix:/var/lib/postfix-test/lmtp"
        postfix_tls_certificate: "/etc/postfix-test/server.crt"
        postfix_tls_private_key: "/etc/postfix-test/server.key"
        postfix_tls_ca_file: "/etc/postfix-test/server.crt"
        postfix_virtual_domains:
          - "example.test"
        postfix_mailboxes:
          - "alice@example.test"
          - "bob@example.test"
          - "archive@example.test"
        postfix_virtual_aliases:
          sales@example.test:
            - "alice@example.test"
            - "bob@example.test"
        postfix_sender_logins:
          alice@example.test:
            - "alice@example.test"
          bob@example.test:
            - "bob@example.test"
          sales@example.test:
            - "alice@example.test"
            - "bob@example.test"
        postfix_local_submitters:
          root:
            - "*"
          postfix_test:
            - "local@example.test"
        postfix_providers:
          - name: "a"
            host: "localhost"
            port: 1587
            username: "provider-a"
            password: "relay-a-secret"
          - name: "b"
            host: "localhost"
            port: 1465
            tls: "wrapper"
            username: "provider-b"
            password: "relay-b-secret"
        postfix_sender_relays:
          alice@example.test: "a"
          bob@example.test: "b"
          sales@example.test: "a"
        postfix_sender_bcc:
          alice@example.test: "archive@example.test"
        postfix_recipient_bcc:
          bob@example.test: "archive@example.test"
        postfix_minimal_backoff_time: "1s"
        postfix_maximal_backoff_time: "2s"
        postfix_queue_run_delay: "1s"
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "side_effect"
    - "converge"
    - "check"
    - "verify"
    - "destroy"
  name: "dev"
platforms:
  - pre_build_image: true
    override_command: false
    systemd: "true"
    groups:
      - "postfix_servers"
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    name: "almalinux-latest-postfix"
    image: "docker.io/jomrr/molecule-almalinux:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    groups:
      - "postfix_servers"
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    name: "debian-latest-postfix"
    image: "docker.io/jomrr/molecule-debian:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    groups:
      - "postfix_servers"
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    name: "fedora-latest-postfix"
    image: "docker.io/jomrr/molecule-fedora:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    groups:
      - "postfix_servers"
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    name: "opensuse-leap-latest-postfix"
    image: "docker.io/jomrr/molecule-opensuse-leap:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    groups:
      - "postfix_servers"
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    name: "opensuse-tumbleweed-latest-postfix"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    groups:
      - "postfix_servers"
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    name: "ubuntu-latest-postfix"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
  - name: "postfix-${MOLECULE_SCENARIO_NAME}-mysql"
    image: "docker.io/library/mariadb:11.4"
    pre_build_image: true
    override_command: false
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "postfix_dependencies"
    env:
      MARIADB_ROOT_PASSWORD: "molecule-database-secret"
      MARIADB_DATABASE: "postfixadmin"
  - name: "postfix-${MOLECULE_SCENARIO_NAME}-pgsql"
    image: "docker.io/library/postgres:16-alpine"
    pre_build_image: true
    override_command: false
    network: "postfix-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "postfix_dependencies"
    env:
      POSTGRES_PASSWORD: "molecule-database-secret"
      POSTGRES_DB: "postfixadmin"
