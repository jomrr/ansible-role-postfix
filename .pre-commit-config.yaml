---
# role: jomrr.postfix
# file: .pre-commit-config.yaml

repos:
  - repo: https://github.com/ansible-community/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        always_run: false
        entry: ansible-lint --force-color --offline --profile production .
        language: python
        pass_filenames: false
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages:
          - commit-msg
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        additional_dependencies:
          - ansible-core==2.22.*
          - mypy
          - pylint
          - ruff
        types:
          - python
      - id: mypy
        name: mypy
        entry: env MYPYPATH=molecule/resources/tests mypy --explicit-package-bases
          --follow-untyped-imports
        language: python
        additional_dependencies:
          - ansible-core==2.22.*
          - mypy
          - pylint
          - ruff
        types:
          - python
      - id: pylint
        name: pylint
        entry: env PYTHONPATH=. pylint
        language: python
        additional_dependencies:
          - ansible-core==2.22.*
          - mypy
          - pylint
          - ruff
        types:
          - python
      - id: unit-tests
        name: Postfix unit tests
        entry: python -m unittest discover -s tests/unit
        language: python
        additional_dependencies:
          - ansible-core==2.22.*
          - mypy
          - pylint
          - ruff
        pass_filenames: false
        types:
          - python
