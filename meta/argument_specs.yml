---
# role: postfix
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Configure local and virtual mail delivery, authenticated submission
      and secure provider relays.
    options:
      postfix_hostname:
        type: str
        default: '{{ ansible_facts.fqdn }}'
        description: Fully qualified hostname announced by the mail server.
      postfix_origin:
        type: str
        default: $myhostname
        description: Domain appended to locally submitted unqualified addresses.
      postfix_interfaces:
        type: list
        default:
          - loopback-only
        description: Global listening interfaces for services without an explicit bind address.
        elements: str
      postfix_protocols:
        type: str
        default: all
        description: IP protocol families enabled by Postfix.
        choices:
          - all
          - ipv4
          - ipv6
      postfix_local_domains:
        type: list
        default:
          - $myhostname
          - localhost
        description: Domains delivered to local Unix accounts through the local delivery
          agent.
        elements: str
      postfix_trusted_networks:
        type: list
        default:
          - 127.0.0.0/8
          - '[::1]/128'
        description: Global trusted networks used by native Postfix parameters. Network
          relay requires explicit listener clients.
        elements: str
      postfix_local_aliases:
        type: dict
        default:
          postmaster: root
          mailer-daemon: postmaster
          abuse: postmaster
        description: Local aliases. Set root to a monitored address or local mailbox.
      postfix_dovecot_auth_socket:
        type: str
        default: private/auth
        description: Dovecot authentication socket relative to the Postfix queue directory.
      postfix_tls_certificate:
        type: str
        default: ''
        description: Certificate chain required by any listener enforcing authentication.
      postfix_tls_private_key:
        type: str
        default: ''
        description: Private key required by either submission service.
      postfix_tls_ca_file:
        type: str
        default: ''
        description: Additional trusted CA bundle for outgoing TLS; empty uses the platform
          bundle.
      postfix_local_submitters:
        type: dict
        default:
          root:
            - '*'
        description: Unix submitters and their permitted envelope senders; root is trusted.
      postfix_account_backend:
        type: str
        default: files
        description: Primary lookup backend for recipients, aliases and sender ownership.
        choices:
          - files
          - mysql
          - pgsql
      postfix_ldap_enabled:
        type: bool
        default: false
        description: Add TLS-verified LDAP mailbox and sender lookups to the primary backend.
      postfix_ldap:
        type: dict
        description: Read-only LDAPS connection, directory eligibility filter and attributes
          identifying a mailbox and its SASL owner.
        options:
          uris:
            type: list
            elements: str
            required: true
            description: LDAPS endpoints with hostnames matching their certificates.
          base:
            type: str
            required: true
            description: Base DN of the directory subtree to search.
          bind_dn:
            type: str
            required: true
            description: Directory reader's bind DN.
          bind_password:
            type: str
            required: true
            no_log: true
            description: Directory reader's password from Ansible Vault or a secret store.
          ca_file:
            type: str
            required: true
            description: Absolute path to the trusted LDAP CA certificate file on the mail
              server.
          eligibility_filter:
            type: str
            required: true
            description: Parenthesized LDAP filter selecting entitled, enabled accounts.
              Postfix also matches the requested address or login.
          mail_attribute:
            type: str
            required: true
            description: Directory attribute holding the envelope address used for mailbox
              and sender lookups.
          login_attribute:
            type: str
            required: true
            description: Directory attribute matching the SASL identity reported by Dovecot,
              such as userPrincipalName.
        default:
          uris: []
          base: ''
          bind_dn: ''
          bind_password: ''
          ca_file: ''
          eligibility_filter: ''
          mail_attribute: mail
          login_attribute: userPrincipalName
      postfix_sasl_access_enabled:
        type: bool
        default: false
        description: Require a positive SASL login access lookup on every listener requiring
          SMTP AUTH. The default permits authenticated clients.
      postfix_sasl_access_logins:
        type: list
        elements: str
        default: []
        description: Explicitly entitled SASL logins, including file-based relay accounts,
          checked before LDAP when the access check is enabled.
      postfix_mailboxes:
        type: list
        default: []
        description: Virtual mailbox addresses from files, available alongside SQL and LDAP.
        elements: str
      postfix_virtual_aliases:
        type: dict
        default: {}
        description: Local virtual aliases and their destinations, searched before SQL and
          LDAP.
      postfix_sender_logins:
        type: dict
        default: {}
        description: Local envelope sender owners, searched before SQL and LDAP.
      postfix_dovecot_lmtp_transport:
        type: str
        default: lmtp:unix:private/dovecot-lmtp
        description: LMTP destination used for virtual mailbox delivery to Dovecot.
      postfix_local_lmtp_enabled:
        type: bool
        default: false
        description: Deliver local Unix mailbox recipients through Dovecot LMTP as well.
      postfix_providers:
        type: list
        default: []
        description: Named external providers with separate credentials and TLS transports.
        elements: dict
        options:
          name:
            type: str
            required: true
            description: Unique lowercase transport name containing letters, digits or underscores.
          host:
            type: str
            required: true
            description: DNS name matching the relay TLS certificate.
          port:
            type: int
            description: Optional override of postfix_provider_port.
          tls:
            type: str
            choices:
              - starttls
              - wrapper
            description: Optional override of postfix_provider_tls.
          username:
            type: str
            required: true
            description: Provider SASL username without whitespace or colon.
          password:
            type: str
            required: true
            no_log: true
            description: Provider SASL password without whitespace; use Ansible Vault.
      postfix_provider_port:
        type: int
        default: 587
        description: Default external provider port, with optional per-provider overrides.
      postfix_provider_tls:
        type: str
        default: starttls
        description: Default external provider TLS mode, with optional per-provider overrides.
        choices:
          - starttls
          - wrapper
      postfix_default_provider:
        type: str
        default: ''
        description: Optional default named provider for unmatched senders in direct mode.
      postfix_sender_relays:
        type: dict
        default: {}
        description: Exact envelope sender addresses mapped to provider names.
      postfix_transport_maps:
        type: dict
        default: {}
        description: Additional recipient domain or address transport routes.
      postfix_tls_policies:
        type: dict
        default: {}
        description: SMTP next-hop destinations mapped to TLS security policies and optional
          certificate matching attributes.
      postfix_sender_bcc:
        type: dict
        default: {}
        description: Envelope senders and their optional outgoing archive copy address.
      postfix_recipient_bcc:
        type: dict
        default: {}
        description: Envelope recipients and their optional incoming archive copy address.
      postfix_message_size_limit:
        type: int
        default: 10240000
        description: Maximum accepted message size in bytes.
      postfix_maximal_queue_lifetime:
        type: str
        default: 5d
        description: Maximum time that undelivered messages remain queued.
      postfix_bounce_queue_lifetime:
        type: str
        default: 5d
        description: Maximum time that undeliverable bounce messages remain queued.
      postfix_minimal_backoff_time:
        type: str
        default: 300s
        description: Minimum delay between delivery retries.
      postfix_maximal_backoff_time:
        type: str
        default: 4000s
        description: Maximum delay between delivery retries.
      postfix_queue_run_delay:
        type: str
        default: 300s
        description: Interval between deferred-queue scans.
      postfix_log_file:
        type: str
        default: ''
        description: Direct Postfix log path. Empty uses the system mail syslog facility
          and its journal integration.
      postfix_tls_loglevel:
        type: int
        default: 1
        description: TLS connection summary logging level.
        choices:
          - 0
          - 1
      postfix_non_smtpd_milters:
        type: list
        default: []
        description: Milter endpoints for local sendmail submissions.
        elements: str
      postfix_milter_default_action:
        type: str
        default: tempfail
        description: Action when an enabled Milter is unavailable.
        choices:
          - tempfail
          - reject
          - accept
      postfix_backup:
        type: bool
        default: false
        description: Preserve previous nonsecret configuration files when they change.
      postfix_database:
        type: dict
        default: {}
        no_log: true
        description: Shared native database connection options for the existing PostfixAdmin
          schema; hosts is required for mysql or pgsql. Use a SELECT-only login and a Unix
          socket or verified TLS.
      postfix_database_queries:
        type: dict
        default: {}
        description: Optional overrides of the PostfixAdmin domains, mailboxes, virtual_aliases,
          alias_domains, alias_domain_catchalls, senders and alias_domain_senders queries.
      postfix_listeners:
        type: dict
        default: {}
        description: Named TCP listeners with independent binding, TLS, authentication,
          relay and recipient policies. Listener options also configure native postscreen
          policy on a screened frontend.
      postfix_outbound:
        type: str
        default: none
        choices:
          - none
          - direct
          - relayhost
        description: Delivery path for nonlocal addresses. Closed mode rejects foreign recipients
          and bounces local submissions to them.
      postfix_relayhost:
        type: dict
        default: {}
        description: Next hop for relayhost mode. Authentication requires certificate-verified
          TLS.
        options:
          host:
            type: str
            description: Relay hostname or numeric address.
          port:
            type: int
            description: TCP port, default 25.
          tls:
            type: str
            description: Relay TLS policy, default secure.
            choices:
              - may
              - encrypt
              - secure
              - wrapper
          username:
            type: str
            description: Optional SASL username.
          password:
            type: str
            description: Optional SASL password.
            no_log: true
      postfix_virtual_mailbox_domains:
        type: list
        elements: str
        default: []
        description: Virtual mailbox domains from inventory, supplemented by active PostfixAdmin
          domains.
      postfix_virtual_alias_domains:
        type: list
        elements: str
        default: []
        description: Domains whose addresses must resolve through virtual alias maps.
      postfix_relay_domains:
        type: list
        elements: str
        default: []
        description: Domains forwarded to another mail server, restricted to the relay recipient
          table.
      postfix_relay_recipients:
        type: list
        elements: str
        default: []
        description: Accepted recipient addresses in relay domains. An explicit @domain
          entry accepts any address in that domain.
      postfix_relay_transport:
        type: str
        default: relay
        description: Postfix transport and optional next hop used for relay domains.
      postfix_direct_tls:
        type: str
        default: may
        choices:
          - may
          - dane
        description: TLS policy for direct SMTP delivery. DANE requires a trusted DNSSEC-validating
          resolver.
      postfix_tls_policy_maps:
        type: list
        elements: str
        default: []
        description: Additional native SMTP TLS policy tables searched after the managed
          destination policies.
      postfix_smtp_helo_name:
        type: str
        default: $myhostname
        description: Hostname announced by the outgoing SMTP client.
      postfix_smtp_bind_address:
        type: str
        default: ''
        description: Optional IPv4 source address for outgoing SMTP.
      postfix_smtp_bind_address6:
        type: str
        default: ''
        description: Optional IPv6 source address for outgoing SMTP.
      postfix_sasl_type:
        type: str
        default: dovecot
        choices:
          - dovecot
          - cyrus
        description: SMTP server authentication implementation.
      postfix_cyrus_sasl_path:
        type: str
        default: smtpd
        description: Cyrus SASL application name when the Cyrus server backend is selected.
      postfix_lmtp_tls_security_level:
        type: str
        default: secure
        choices:
          - none
          - may
          - encrypt
          - verify
          - secure
        description: LMTP uses a local Unix socket by default. TCP defaults to secure and
          verifies the peer against the trusted CA.
      postfix_lmtp_tls_ca_file:
        type: str
        default: ''
        description: CA bundle for TCP LMTP delivery. Empty selects the platform trust store.
      postfix_recipient_delimiter:
        type: str
        default: +
        description: Recipient address extension delimiters.
      postfix_compatibility_level:
        type: str
        default: '3.6'
        description: Postfix compatibility level used by the installed daemon.
      postfix_forbid_bare_newline:
        type: str
        default: normalize
        choices:
          - normalize
          - reject
          - 'no'
        description: SMTP handling of bare newlines. Active listeners require a Postfix
          build supporting the selected policy.
      postfix_bare_newline_exclusions:
        type: list
        elements: str
        default:
          - $mynetworks
        description: Client networks exempt from the SMTP bare-newline policy.
      postfix_smtp_tls_protocols:
        type: str
        default: '>=TLSv1.2'
        description: Protocol bounds for both optional and mandatory TLS on outbound SMTP.
      postfix_smtpd_tls_protocols:
        type: str
        default: '>=TLSv1.2'
        description: Protocol bounds for both optional and mandatory TLS on incoming SMTP.
      postfix_client_auth_rate_limit:
        type: int
        default: 30
        description: Maximum authentication attempts per client per anvil rate interval
          (normally 60 seconds). Zero disables the limit.
      postfix_client_connection_rate_limit:
        type: int
        default: 60
        description: Maximum new connections per client per anvil rate interval (normally
          60 seconds). Zero disables the limit.
      postfix_client_connection_count_limit:
        type: int
        default: 50
        description: Per-client limit on simultaneous connections. Zero disables this limit.
      postfix_milter_protocol:
        type: int
        default: 6
        description: Protocol version used by configured Milters.
      postfix_main_cf:
        type: dict
        default: {}
        description: Additional single-line main.cf parameters. Role-owned delivery invariants
          apply in closed mode.
      postfix_master_cf:
        type: list
        elements: dict
        default: []
        description: Additional native master.cf services. Give each service a unique name
          and type.
        options:
          name:
            type: str
            description: Postfix service name.
            required: true
          type:
            type: str
            description: Postfix service type.
            required: true
            choices:
              - inet
              - unix
              - unix-dgram
              - fifo
              - pass
          command:
            type: str
            description: Postfix daemon and optional command arguments.
            required: true
          private:
            type: str
            description: Private service flag.
          unprivileged:
            type: str
            description: Unprivileged execution flag.
          chroot:
            type: str
            description: Chroot flag.
          wakeup:
            type: str
            description: Wakeup interval.
          limit:
            type: str
            description: Process limit.
          options:
            type: dict
            description: Native per-service parameter overrides.
      postfix_tables:
        type: dict
        default: {}
        description: Additional managed lookup tables keyed by name, with entries, type,
          optional main.cf parameter and explicit secret flag.
      postfix_ldap_address_domains:
        type: list
        elements: str
        default: []
        description: Additional domains eligible for LDAP address lookups, including domains
          obtained dynamically from SQL.
      postfix_ldap_alias_queries:
        type: dict
        default: {}
        description: Optional LDAP alias or distribution-list maps with a keyed address
          filter, result attributes and optional recursive group attributes.
      postfix_logrotate_interval:
        type: str
        default: daily
        choices:
          - daily
          - weekly
          - monthly
        description: Rotation interval when direct file logging is enabled.
      postfix_logrotate_count:
        type: int
        default: 14
        description: Number of rotated Postfix log files to retain.
