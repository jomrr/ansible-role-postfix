---
# role: postfix
# file: handlers/main.yml

- name: POSTFIX | Check native configuration and queue permissions
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [postfix, check]
  changed_when: false
  listen: reload postfix

- name: POSTFIX | Apply service configuration and reopen listening interfaces when required
  become: true
  become_user: root
  ansible.builtin.service:
    name: postfix
    state: "{{ 'restarted' if __postfix_previous_network.stdout_lines != __postfix_desired_network else 'reloaded' }}"
  listen: reload postfix
