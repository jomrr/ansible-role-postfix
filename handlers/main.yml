---
# role: postfix
# file: handlers/main.yml

- name: Restart Postfix
  become: true
  become_user: root
  ansible.builtin.service:
    name: postfix
    state: restarted
  listen: restart postfix

- name: Reload Postfix
  become: true
  become_user: root
  ansible.builtin.service:
    name: postfix
    state: reloaded
  listen: reload postfix
